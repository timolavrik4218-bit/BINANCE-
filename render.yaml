services:
  - type: web
    name: binance-ai-trader
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python binance_ai_trader.py
    healthCheckPath: /
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_SECRET_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
